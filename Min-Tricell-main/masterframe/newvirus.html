<div id="nv-container">
    <h2 id="nv-title">Add New Research Object</h2>

    <form name="newvirusform" action="http://localhost:3000/api/newvirus" onSubmit="return formCheckNewVirus()" method="post" enctype="multipart/form-data">

        <div class="nv-row">
            <label class="nv-label">Number:</label>
            <input type="text" name="fnumber" id="fnumber" class="nv-input-small" maxlength="7" />
        </div>
        <div class="nv-row">
            <label class="nv-label">Name:</label>
            <input type="text" name="fname" id="fname" class="nv-input-wide" maxlength="30" />
        </div>
        <div class="nv-row nv-row-top">
            <label class="nv-label">Text:</label>
            <textarea name="ftext" id="ftext" class="nv-textarea"></textarea>
        </div>

        <div class="nv-field">
            <label class="nv-label-top">Security Data Sheet:</label>
            <input type="file" name="ffile" id="ffile" class="nv-input-full" />
        </div>
        <div class="nv-field">
            <label class="nv-label-top">Security Presentation Video:</label>
            <input type="url" name="fpresentationvideo" id="fpresentationvideo" class="nv-input-full" />
        </div>
        <div class="nv-field">
            <label class="nv-label-top">Security Handling Video:</label>
            <input type="url" name="fhandlingvideo" id="fhandlingvideo" class="nv-input-full" />
        </div>

        <div id="nv-submit-row">
            <input type="submit" id="nv-submit" value="Create" />
        </div>

    </form>
</div>
