function editVideoLink(virusnumber, type) {
    var label = type === 'presentation' ? 'Security Presentation Video' : 'Security Handling Video';
    var link = prompt("Enter link for " + label + ": \n(You have to click Edit Info after this to save the link)");
    if(label === "Security Presentation Video") {
        document.getElementById('fvirusvideo').value = link;
        document.getElementById('virusvideo').textContent = link;
    } else {
        document.getElementById('fvirushandlingvideo').value = link;
        document.getElementById('virushandlingvideo').textContent = link;
    }
}
